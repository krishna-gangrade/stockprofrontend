name: Frontend CI/CD
run-name: Frontend CI/CD @ ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:prod

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run SonarQube analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          if [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "SONAR_ORGANIZATION is not set. Skipping frontend Sonar analysis."
            exit 0
          fi
          if ! curl -fsS --max-time 15 "${SONAR_HOST_URL}/api/system/status" >/dev/null; then
            echo "SonarQube is unreachable from GitHub Actions. Skipping analysis."
            exit 0
          fi
          npx sonar-scanner \
            --define project.settings=sonar-project.properties \
            --define sonar.host.url="${SONAR_HOST_URL}" \
            --define sonar.token="${SONAR_TOKEN}" \
            --define sonar.organization="${SONAR_ORGANIZATION}"

  deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            echo "GitHub SHA: ${{ github.sha }}"
            echo "Workflow ref: ${{ github.workflow_ref }}"
            echo "Deploy target host port: 4200"
            export GH_PAT="${{ secrets.GH_PAT }}"
            export REPO_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
            export APP_DIR="/opt/stockpro/frontend"
            command -v git >/dev/null 2>&1
            command -v docker >/dev/null 2>&1
            command -v curl >/dev/null 2>&1

            mkdir -p "${APP_DIR}"

            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            gateway_ready=0
            for attempt in $(seq 1 60); do
              if curl -fsS http://localhost:8082/actuator/health >/dev/null 2>&1; then
                gateway_ready=1
                break
              fi
              sleep 5
            done
            if [ "$gateway_ready" -ne 1 ]; then
              echo "Gateway health check failed before frontend deployment."
              docker logs --tail 100 stockpro-gateway || true
              exit 1
            fi

            docker network inspect stockpro-network >/dev/null 2>&1 || docker network create stockpro-network
            docker build --pull -t stockpro-frontend:latest .
            docker rm -f stockpro-frontend >/dev/null 2>&1 || true
            echo "Starting frontend container on host port 4200"
            docker run -d \
              --name stockpro-frontend \
              --restart unless-stopped \
              --network stockpro-network \
              --add-host=host.docker.internal:host-gateway \
              -p 4200:80 \
              stockpro-frontend:latest

            frontend_ready=0
            for attempt in $(seq 1 36); do
              if curl -fsS "http://localhost:4200" >/dev/null 2>&1; then
                frontend_ready=1
                break
              fi
              sleep 5
            done
            if [ "$frontend_ready" -ne 1 ]; then
              echo "Frontend health check failed after deployment."
              docker ps || true
              docker logs --tail 200 stockpro-frontend || true
              docker logs --tail 100 stockpro-gateway || true
              exit 1
            fi

            if command -v nginx >/dev/null 2>&1; then
              echo "Checking host nginx config for stockpro.linkpc.net"
              DOMAIN="stockpro.linkpc.net"
              NGINX_UPDATED=0
              for conf in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf /etc/nginx/sites-available/*; do
                [ -f "$conf" ] || continue
                if grep -q "$DOMAIN" "$conf"; then
                  echo "Updating nginx upstream in $conf"
                  sudo sed -i -E 's#proxy_pass[[:space:]]+http://(127\\.0\\.0\\.1|localhost)(:[0-9]+)?;#proxy_pass http://127.0.0.1:4200;#g' "$conf"
                  sudo sed -i -E 's#proxy_pass[[:space:]]+http://[^;]+:80;#proxy_pass http://127.0.0.1:4200;#g' "$conf"
                  NGINX_UPDATED=1
                fi
              done

              if [ "$NGINX_UPDATED" -eq 1 ]; then
                echo "Reloading nginx with frontend upstream on port 4200"
                sudo nginx -t
                reloaded=0
                if sudo systemctl reload nginx >/dev/null 2>&1; then
                  reloaded=1
                elif sudo service nginx reload >/dev/null 2>&1; then
                  reloaded=1
                elif sudo nginx -s reload >/dev/null 2>&1; then
                  reloaded=1
                fi

                if [ "$reloaded" -ne 1 ]; then
                  echo "Unable to reload nginx automatically after updating config."
                  exit 1
                fi
              else
                echo "No stockpro.linkpc.net nginx vhost found to update automatically."
              fi
            fi
