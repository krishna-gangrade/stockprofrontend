name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:prod

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run SonarQube analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        run: npx sonar-scanner --define project.settings=sonar-project.properties --define sonar.host.url="${SONAR_HOST_URL}" --define sonar.token="${SONAR_TOKEN}"

  deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            export GH_PAT="${{ secrets.GH_PAT }}"
            export REPO_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
            export APP_DIR="/opt/stockpro/frontend"

            require_command() {
              command -v "$1" >/dev/null 2>&1 || {
                echo "Required command '$1' is not installed on the EC2 host."
                exit 1
              }
            }

            wait_for_http() {
              local url="$1"
              local timeout_seconds="${2:-180}"
              local start_time
              start_time="$(date +%s)"

              until curl -fsS "$url" >/dev/null 2>&1; do
                if [ "$(( $(date +%s) - start_time ))" -ge "$timeout_seconds" ]; then
                  echo "Timed out waiting for $url"
                  return 1
                fi
                sleep 5
              done
            }

            dump_debug_state() {
              docker ps || true
              echo "----- stockpro-frontend logs -----"
              docker logs --tail 200 stockpro-frontend || true
              echo "----- stockpro-gateway logs -----"
              docker logs --tail 100 stockpro-gateway || true
            }

            trap dump_debug_state ERR

            require_command git
            require_command docker
            require_command curl

            mkdir -p "${APP_DIR}"

            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            wait_for_http "http://localhost:8082/actuator/health" 300
            docker network inspect stockpro-network >/dev/null 2>&1 || docker network create stockpro-network
            docker build --pull -t stockpro-frontend:latest .
            docker rm -f stockpro-frontend >/dev/null 2>&1 || true
            docker run -d \
              --name stockpro-frontend \
              --restart unless-stopped \
              --network stockpro-network \
              -p 80:80 \
              stockpro-frontend:latest

            wait_for_http "http://localhost" 180
            docker exec stockpro-frontend wget -qO- http://stockpro-gateway:8082/actuator/health >/dev/null
